<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Singapore Family Trip · Pamphlet View</title>
<style>
html,body{margin:0;background:#edf2f6;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif}
.shell{min-height:100vh}
.topbar{height:46px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px;background:#f7fafc;border-bottom:1px solid #dbe3ea;position:sticky;top:0;z-index:10}
.brand{font-size:14px;font-weight:900;color:#17324f}.brand small{display:block;font-size:9px;font-weight:700;color:#6b7a89;margin-top:1px}
.actions{display:flex;gap:6px}.actions a{border:1px solid #d7e0e7;background:#fff;color:#17324f;text-decoration:none;border-radius:8px;padding:6px 8px;font-size:9px;font-weight:850}
#appframe{display:block;width:100%;height:calc(100vh - 47px);border:0;background:white}
@media(max-width:640px){.topbar{height:42px;padding:0 7px}.brand{font-size:12px}.brand small{display:none}.actions a{font-size:8px;padding:5px 7px}#appframe{height:calc(100vh - 43px)}}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand">🇸🇬 Singapore Family Trip · Pamphlet View<small>최종 index.html 기능은 그대로, 디자인만 팜플렛 테마</small></div>
    <div class="actions"><a href="./index.html">기존 화면</a></div>
  </div>
  <iframe id="appframe" src="./index.html" title="Singapore Family Trip"></iframe>
</div>
<script>
const frame=document.getElementById('appframe');
const theme=`
:root{
 --bg:#eef3f7!important;--card:#fff!important;--ink:#17324f!important;--muted:#677789!important;--line:#d8e2ea!important;
 --accent:#0f766e!important;--soft:#edf8f5!important;--blue:#2f6f9f!important;--warn:#9a6700!important;--warnbg:#fff8e6!important;
}
html{scroll-behavior:smooth}
body{background:linear-gradient(#f7fafc,#eef3f7)!important;color:#203040!important}
.wrap{max-width:1180px!important;padding:10px!important}
.hero{border-radius:15px!important;border:1px solid #d9e3eb!important;box-shadow:0 8px 24px rgba(35,55,70,.07)!important;padding:14px 16px!important;background:linear-gradient(110deg,#fafdff,#f4f8fb)!important}
h1{font-size:clamp(22px,3vw,30px)!important;line-height:1.12!important;letter-spacing:-.4px!important}
.sub{margin-top:5px!important;font-size:12px!important}
.badges{margin-top:9px!important;gap:5px!important}.badge{font-size:10px!important;padding:5px 8px!important}
.headtools{grid-template-columns:1fr 1fr!important;gap:6px!important;margin-top:8px!important}.headtool{padding:8px 9px!important;border-radius:10px!important;background:rgba(255,255,255,.9)!important;font-size:10px!important}
.tabs{gap:5px!important;padding:9px 0 7px!important}.tab{border-radius:10px!important;padding:8px 10px!important;font-size:11px!important}.tab.active{background:#17324f!important;color:white!important}
.dayhead{padding:12px 14px!important;margin-bottom:8px!important;border-radius:13px!important;background:linear-gradient(100deg,#edf6ff,#fff)!important;border:1px solid #dce6ef!important;box-shadow:0 4px 14px rgba(35,55,70,.05)!important}
.dayhead h2{font-size:clamp(17px,2.4vw,23px)!important;margin:0 0 2px!important}.dayhead .theme{font-size:10px!important}
.layout{grid-template-columns:minmax(0,1.12fr) minmax(320px,.88fr)!important;gap:8px!important;align-items:start!important}
.panel{border-radius:12px!important;border:1px solid #d9e2ea!important;padding:11px!important;box-shadow:0 4px 14px rgba(35,55,70,.04)!important;background:#fff!important}
.panel h2,.panel h3{margin-top:0!important}
.timeline{gap:0!important}.slot{padding:9px 0!important}.slot-top{grid-template-columns:78px minmax(0,1fr)!important;gap:8px!important}.when{font-size:11px!important;color:#256a9c!important}.activity b{font-size:12px!important}.steps{margin:3px 0 0!important;padding-left:16px!important;font-size:10px!important}.steps li{margin:2px 0!important}.meta{font-size:9px!important;padding:6px 7px!important;border-radius:8px!important}.note{font-size:9px!important}
details{margin-top:5px!important;border-radius:8px!important}summary{padding:6px 8px!important;font-size:10px!important}.details-body{padding:0 8px 8px!important;font-size:9px!important}
.logbtn{font-size:9px!important;padding:5px 7px!important;border-radius:8px!important}
.mastergrid{gap:8px!important;margin-top:8px!important}.mini{font-size:10px!important}
.studyintro,.studycard,.prepsection,.journalhero,.journalday{border-radius:12px!important;border:1px solid #d9e2ea!important;box-shadow:0 4px 14px rgba(35,55,70,.04)!important}
.browsernotice{font-size:9px!important;padding:7px 28px 7px 9px!important;margin:6px 0!important}.sharedstatus{font-size:9px!important;padding:7px 8px!important}.clockrow{gap:7px!important}.clockitem b{font-size:11px!important}.fxrow{gap:4px!important}.fxrow input{padding:4px 6px!important;font-size:10px!important}
.modebar{gap:5px!important;margin-top:8px!important}.modebtn{padding:7px 9px!important;font-size:10px!important;border-radius:9px!important}
.footer{font-size:9px!important;margin:14px 0 20px!important}
@media(max-width:820px){
 .wrap{padding:6px!important}.hero{padding:10px!important}h1{font-size:21px!important}.headtools{grid-template-columns:1fr!important}.tabs{position:sticky!important;top:0!important;z-index:50!important;background:#eef3f7!important;padding-top:5px!important}.tab{font-size:9px!important;padding:7px 8px!important}.layout{grid-template-columns:1fr!important}.panel{padding:9px!important}.slot-top{grid-template-columns:1fr!important;gap:2px!important}.when{font-size:9px!important}.activity b{font-size:11px!important}.steps{font-size:9px!important}.dayhead{padding:10px 11px!important}.dayhead h2{font-size:17px!important}
}
`;
function injectTheme(){
  try{
    const doc=frame.contentDocument;
    if(!doc)return;
    let s=doc.getElementById('pamphlet-theme-v1');
    if(!s){s=doc.createElement('style');s.id='pamphlet-theme-v1';doc.head.appendChild(s)}
    s.textContent=theme;
  }catch(e){console.error(e)}
}
frame.addEventListener('load',()=>{injectTheme();setTimeout(injectTheme,300);setTimeout(injectTheme,1200)});
</script>
</body>
</html>

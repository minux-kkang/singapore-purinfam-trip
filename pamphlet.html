<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Singapore Family Trip · Pamphlet v14</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
 integrity="sha256-p4NxAoJBhIINfQ3ynHTfQjMZbKMs0xG9R+snXkV8Lwc=" crossorigin="">
<style>
:root{
  --bg:#f4f8fa;--card:#fff;--ink:#17364f;--muted:#71818c;--line:#dfe7eb;
  --mint:#e9f7f4;--mintInk:#0b7d73;--blue:#315b8a;--warm:#fff4e6
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif}
body{padding-bottom:80px}
.top{position:sticky;top:0;z-index:30;background:#ffffffef;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.toprow{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.brand{font-size:15px;font-weight:950}.brand small{font-size:10px;color:#93a0a8;margin-left:4px}
.practical{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;color:var(--ink);text-decoration:none;font-size:11px;font-weight:900}
.livebar{padding:0 12px 9px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.livebox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.livebox b{font-size:11px}.livebox span{font-size:11px;color:#647581}
.weatherline{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:2px}
.weatherline .temp{font-weight:950;color:var(--ink)}
.weatherline .desc{color:#647581}
.fxrow{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:6px;font-size:11px;flex-wrap:wrap}
.fxrow input{width:86px;border:1px solid #d4dee3;border-radius:8px;padding:6px 7px;text-align:center;font:inherit;background:#fff}
.fxrateinfo{width:100%;text-align:center;font-size:10px;color:#82919a;margin-top:-1px}
.fxarrow{font-weight:900;color:#82919a}
.days{display:flex;gap:7px;overflow:auto;padding:0 12px 10px;scrollbar-width:none}.days::-webkit-scrollbar{display:none}
.daybtn{border:0;background:#edf2f4;color:#526773;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:900;white-space:nowrap}
.daybtn.on{background:var(--ink);color:#fff}
.wrap{max-width:760px;margin:auto;padding:12px}
.hero{min-height:155px;border:1px solid var(--line);border-radius:24px;padding:22px;background:linear-gradient(145deg,#e7f6f2,#f3f7fb 64%,#fff1df);display:flex;flex-direction:column;justify-content:flex-end;position:relative;margin-bottom:12px}
.heroemoji{position:absolute;right:20px;top:15px;font-size:49px}.heroday{font-size:12px;font-weight:950;color:var(--mintInk)}
.herotitle{font-size:30px;font-weight:1000;line-height:1.05;letter-spacing:-1px;margin-top:4px}.herosub{font-size:13px;color:#71818c;font-weight:700;margin-top:8px}
.timeline{display:grid;gap:9px}.item{background:#fff;border:1px solid var(--line);border-radius:18px;min-height:72px;padding:12px 13px;display:grid;grid-template-columns:64px minmax(0,1fr) 19px;gap:10px;align-items:center;box-shadow:0 4px 14px rgba(23,54,79,.035);cursor:pointer}
.time{background:var(--mint);color:var(--mintInk);border-radius:999px;padding:8px 5px;text-align:center;font-size:12px;font-weight:950;line-height:1.15}
.title{font-size:18px;font-weight:950;line-height:1.25;letter-spacing:-.35px;word-break:keep-all}.arrow{font-size:23px;color:#a5b0b7}

.daymapwrap{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:13px;box-shadow:0 4px 14px rgba(23,54,79,.035)}
.daymaphead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:10px}
.daymaphead b{font-size:13px;color:var(--ink)}.daymaphead small{font-size:10px;color:#87959e;text-align:right}
.daymap{width:100%;height:390px;border-radius:14px;background:#eef3f5;overflow:hidden;border:1px solid #e4ecef}
.daymap .leaflet-container{font-family:inherit}
.map-water{fill:#e9f7ff}
.map-land{fill:#fbfcfd}
.map-park{fill:#edf7ef}
.map-island{fill:#f8fbfc;stroke:#d6e1e6;stroke-width:1.5}
.map-river{fill:none;stroke:#cfe8f6;stroke-width:18;stroke-linecap:round;stroke-linejoin:round}
.map-bay{fill:#e6f5ff;stroke:#d3eaf5;stroke-width:2}
.map-road{fill:none;stroke:#d3dde3;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.map-road.minor{stroke-width:4;opacity:.7}
.map-line{fill:none;stroke:#adbfc9;stroke-width:2.2;stroke-dasharray:3 5}
.map-route{fill:none;stroke:#17364f;stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round}
.map-route.walk{stroke-dasharray:4 5;stroke-width:3.1}
.map-route.mrt{stroke-width:5.3}
.map-route.taxi{stroke-dasharray:10 7}
.map-route.option{stroke:#8ba0ad;stroke-dasharray:6 6}
.map-label{font-size:10.6px;font-weight:850;fill:#284050}
.map-small{font-size:8.8px;fill:#7e8d96}
.map-line-label{font-size:8.4px;font-weight:700;fill:#315b8a}
.pin circle{fill:#17364f;stroke:#fff;stroke-width:3}
.pin text{fill:#fff;font-size:10px;font-weight:950;text-anchor:middle;dominant-baseline:middle}
.pin.hotel circle{fill:#0b7d73}
.maplegend{display:flex;gap:10px;flex-wrap:wrap;margin-top:9px;font-size:10px;color:#6f808b}
.maplegend span{display:flex;align-items:center;gap:4px}.maplegend i{display:inline-block;width:20px;height:0;border-top:3px solid #17364f}
.maplegend i.walk{border-top-style:dashed;border-top-width:2px}.maplegend i.taxi{border-top-style:dashed}.maplegend i.option{border-top-color:#8ba0ad;border-top-style:dashed}
.mapnote{margin-top:7px;font-size:10px;color:#819099}

.route-num-icon{background:transparent;border:0}
.route-num-icon .bubble{
  width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:#101820;color:#fff;border:3px solid #fff;box-shadow:0 2px 8px #0005;
  font-size:13px;font-weight:950
}
.route-num-icon.hotel .bubble{background:#0f766e}
.route-label{
  background:#fff;border:1px solid #d9e2e6;border-radius:8px;padding:3px 6px;
  box-shadow:0 2px 7px #0002;color:#17364f;font-size:11px;font-weight:850;white-space:nowrap
}
.maplegend .mrtline{border-top:4px solid #315b8a}
.maplegend .walkline{border-top:3px dashed #0f766e}
.maplegend .taxiline{border-top:4px solid #7d5200}
.maplegend .optionline{border-top:3px dashed #8ba0ad}

.footer{text-align:center;font-size:11px;color:#98a4ab;padding:18px 0}

.backdrop{position:fixed;inset:0;background:#0d223270;opacity:0;pointer-events:none;z-index:50;transition:.2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-radius:24px 24px 0 0;max-height:88dvh;transform:translateY(105%);transition:.22s;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
body.open .backdrop{opacity:1;pointer-events:auto}body.open .sheet{transform:translateY(0)}
.handle{width:42px;height:5px;background:#d2dbe0;border-radius:99px;margin:9px auto 5px}.sheethead{display:flex;justify-content:space-between;gap:12px;padding:7px 17px 10px}
.stime{font-size:12px;color:var(--mintInk);font-weight:950}.stitle{font-size:21px;line-height:1.3;font-weight:950}.close{border:0;background:#eef3f5;width:36px;height:36px;border-radius:50%;font-size:21px}
.body{overflow:auto;padding:0 16px 28px;font-size:14px;line-height:1.6;color:#314956}
.section{padding:14px 0;border-bottom:1px solid #edf1f3}.section:last-child{border-bottom:0}
.section h3{font-size:13px;margin:0 0 8px;color:#17364f}.route{background:#f7fbfc;border:1px solid #dde9ed;border-radius:14px;padding:12px}
.route-line{display:grid;gap:7px}.stop{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start}.dot{width:24px;height:24px;border-radius:50%;background:#17364f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:950}.stop b{display:block}.stop small{display:block;color:#7a8a94;margin-top:2px}
.connector{width:2px;height:18px;background:#b9c8cf;margin-left:11px}
.checklist{display:grid;gap:7px}.check{background:#fffaf3;border:1px solid #f1dfc8;border-radius:12px;padding:9px 10px;font-size:12px}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.actions button,.actions a{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:11px 8px;text-align:center;text-decoration:none;font-weight:900;font-size:12px}.actions .primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.detailsbox{background:#f7f8fa;border-radius:12px;padding:11px;font-size:12px}.memo{width:100%;min-height:120px;border:1px solid #d5e0e5;border-radius:12px;padding:11px;font:inherit}
@media(min-width:700px){.timeline{grid-template-columns:1fr 1fr}}
</style>
</head>

let dayMap=null;
let routeLayers=[];

function markerIcon(n,type,option){
  return L.divIcon({
    className:"route-num-icon "+(type==="hotel"?"hotel":""),
    html:`<div class="bubble" style="${option?'background:#7d8d97':''}">${n}</div>`,
    iconSize:[30,30],iconAnchor:[15,15]
  });
}
function modeStyle(mode){
  if(mode==="walk") return {color:"#0f766e",weight:5,dashArray:"6 8",opacity:.92};
  if(mode==="mrt") return {color:"#315b8a",weight:6,opacity:.9};
  if(mode==="taxi") return {color:"#7d5200",weight:5,opacity:.9};
  return {color:"#8ba0ad",weight:4,dashArray:"7 8",opacity:.85};
}
async function addRoadRoute(map,a,b,mode){
  const style=modeStyle(mode);
  const fallback=L.polyline([[a.lat,a.lng],[b.lat,b.lng]],style).addTo(map);
  try{
    const url=`https://router.project-osrm.org/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`;
    const r=await fetch(url);
    if(!r.ok) throw new Error("route");
    const j=await r.json();
    const coords=j.routes?.[0]?.geometry?.coordinates?.map(x=>[x[1],x[0]]);
    if(coords?.length){
      map.removeLayer(fallback);
      L.polyline(coords,style).addTo(map);
    }
  }catch(e){}
}
function renderDayMap(){
  const m=DAY_MAPS[day];
  dayMapWrap.innerHTML=`<div class="daymaphead"><b>🗺️ ${esc(m.title)}</b><small>${esc(m.subtitle)}</small></div>
    <div id="leafletDayMap" class="daymap"></div>
    <div class="maplegend">
      <span><i class="mrtline"></i>MRT/모노레일</span>
      <span><i class="walkline"></i>도보</span>
      <span><i class="taxiline"></i>Grab/차량</span>
      <span><i class="optionline"></i>OPTION</span>
    </div>
    <div class="mapnote">실제 OpenStreetMap 배경 위에 장소 좌표와 이동 흐름을 표시합니다. 차량 구간은 온라인 상태에서 실제 도로 경로를 불러오고, 실패하면 저장된 구간선으로 표시합니다.</div>`;

  if(dayMap){dayMap.remove();dayMap=null;}
  dayMap=L.map("leafletDayMap",{zoomControl:true,scrollWheelZoom:false});
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:19,
    attribution:'&copy; OpenStreetMap contributors'
  }).addTo(dayMap);

  const bounds=[];
  m.places.forEach((p,idx)=>{
    bounds.push([p.lat,p.lng]);
    const mk=L.marker([p.lat,p.lng],{icon:markerIcon(p.n,p.type,p.option)}).addTo(dayMap);
    mk.bindTooltip(`<div class="route-label">${esc(p.name)}</div>`,{direction:"top",offset:[0,-14],opacity:1});
    mk.on("click",()=>{ const cardIndex=Math.min(idx,current().items.length-1); if(current().items[cardIndex]) openItem(cardIndex); });
  });

  m.segments.forEach(s=>{
    if(s.route){
      const a=m.places[s.from],b=m.places[s.to];
      addRoadRoute(dayMap,a,b,s.mode);
    }else if(s.path){
      L.polyline(s.path,modeStyle(s.mode)).addTo(dayMap);
    }
  });

  dayMap.fitBounds(bounds,{padding:[28,28],maxZoom:15});
  setTimeout(()=>dayMap.invalidateSize(),100);
}

function weatherText(code){
 const c=Number(code);
 if(c===0)return["☀️","맑음"];
 if(c===1)return["🌤️","대체로 맑음"];
 if(c===2)return["⛅","구름 조금"];
 if(c===3)return["☁️","흐림"];
 if(c===45||c===48)return["🌫️","안개"];
 if([51,53,55,56,57].includes(c))return["🌦️","이슬비"];
 if([61,63,65,66,67].includes(c))return["🌧️","비"];
 if([71,73,75,77].includes(c))return["🌨️","눈"];
 if([80,81,82].includes(c))return["🌦️","소나기"];
 if([85,86].includes(c))return["🌨️","눈 소나기"];
 if([95,96,99].includes(c))return["⛈️","뇌우"];
 return["🌡️","날씨"];
}

async function loadWeather(key,lat,lon,tempId,textId,iconId){
 const cacheKey="pamphlet_weather_"+key;
 try{
   const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`;
   const r=await fetch(url,{cache:"no-store"});
   if(!r.ok)throw new Error("weather");
   const j=await r.json();
   const data={temp:Math.round(j.current.temperature_2m),code:j.current.weather_code,ts:Date.now()};
   localStorage.setItem(cacheKey,JSON.stringify(data));
   paintWeather(data,tempId,textId,iconId);
 }catch(e){
   try{
     const cached=JSON.parse(localStorage.getItem(cacheKey)||"null");
     if(cached){paintWeather(cached,tempId,textId,iconId,true);return;}
   }catch(_){}
   document.getElementById(textId).textContent="날씨 확인 실패";
 }
}
function paintWeather(data,tempId,textId,iconId,cached=false){
 const [icon,text]=weatherText(data.code);
 document.getElementById(tempId).textContent=`${data.temp}°`;
 document.getElementById(textId).textContent=text+(cached?" · 저장값":"");
 document.getElementById(iconId).textContent=icon;
}

let fxRate=1080;
const sgdInput=document.getElementById("sgdAmount");
const krwInput=document.getElementById("krwAmount");
const fxInfo=document.getElementById("fxRateInfo");

function fmtKRW(v){return Math.round(v).toLocaleString("ko-KR")}
function parseNumber(v){return Number(String(v).replace(/,/g,"").trim())||0}
function fromSGD(){
 const s=parseNumber(sgdInput.value);
 krwInput.value=fmtKRW(s*fxRate);
}
function fromKRW(){
 const k=parseNumber(krwInput.value);
 const s=fxRate?k/fxRate:0;
 sgdInput.value=(Math.round(s*100)/100).toString();
}
sgdInput.addEventListener("input",fromSGD);
krwInput.addEventListener("input",fromKRW);
krwInput.addEventListener("focus",()=>{krwInput.value=String(parseNumber(krwInput.value)||"")});
krwInput.addEventListener("blur",()=>{krwInput.value=fmtKRW(parseNumber(krwInput.value));});

async function loadFx(){
 const cacheKey="pamphlet_fx_sgd_krw";
 try{
   const r=await fetch("https://api.frankfurter.app/latest?from=SGD&to=KRW",{cache:"no-store"});
   if(!r.ok)throw new Error("fx");
   const j=await r.json();
   if(!j.rates?.KRW)throw new Error("fx");
   fxRate=Number(j.rates.KRW);
   localStorage.setItem(cacheKey,JSON.stringify({rate:fxRate,date:j.date||"",ts:Date.now()}));
   fxInfo.textContent=`1 SGD ≈ ${fxRate.toLocaleString("ko-KR",{maximumFractionDigits:2})} KRW · ${j.date||"최신"}`;
 }catch(e){
   try{
     const cached=JSON.parse(localStorage.getItem(cacheKey)||"null");
     if(cached?.rate){
       fxRate=Number(cached.rate);
       fxInfo.textContent=`1 SGD ≈ ${fxRate.toLocaleString("ko-KR",{maximumFractionDigits:2})} KRW · 저장된 환율`;
     }else{
       fxInfo.textContent=`1 SGD = ${fxRate.toLocaleString("ko-KR")} KRW · 임시값`;
     }
   }catch(_){
     fxInfo.textContent=`1 SGD = ${fxRate.toLocaleString("ko-KR")} KRW · 임시값`;
   }
 }
 fromSGD();
}

clocks();
setInterval(clocks,60000);
loadWeather("seoul",37.5665,126.9780,"krTemp","krWeather","krWeatherIcon");
loadWeather("singapore",1.3521,103.8198,"sgTemp","sgWeather","sgWeatherIcon");
loadFx();
render();
</script>

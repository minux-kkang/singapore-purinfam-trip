const dayColors=["#0b76b5","#1b9cda","#18874d","#ef6a18","#139cad","#6737b4"];
function applyPamphletColors(doc){
  try{
    const days=[...doc.querySelectorAll(".day")];
    days.forEach((el,i)=>el.style.setProperty("--day-color",dayColors[i]||dayColors[0]));
    const tabs=[...doc.querySelectorAll(".tabs .tab")];
    tabs.forEach((el,i)=>{
      el.style.setProperty("--day-color",dayColors[i]||dayColors[0]);
      if(el.classList.contains("active")) el.style.background=dayColors[i]||dayColors[0];
      el.addEventListener("click",()=>setTimeout(()=>{
        tabs.forEach((t,j)=>{t.style.background=t.classList.contains("active")?(dayColors[j]||dayColors[0]):"#e4eaf0"});
      },20),{passive:true});
    });
  }catch(e){}

function pamphletIconFor(text){
 const t=(text||"").toLowerCase();
 if(/공항|출발|도착|비행|항공|changi|incheon/.test(t)) return "✈️";
 if(/hotel|호텔|체크인|휴식|짐/.test(t)) return "🛏️";
 if(/uss|universal|어트랙션|ride/.test(t)) return "🎢";
 if(/garden|flower|cloud forest|supertree|공원|tree tunnel/.test(t)) return "🌿";
 if(/zoo|river wonders|night safari|동물/.test(t)) return "🦁";
 if(/oceanarium|sea|해변|siloso/.test(t)) return "🐠";
 if(/luge|skyride/.test(t)) return "🏎️";
 if(/점심|저녁|식사|food|jumbo|crab|maxwell/.test(t)) return "🍽️";
 if(/museum|chijmes|raffles|cathedral|temple|mosque|little india|kampong/.test(t)) return "🏛️";
 if(/cruise|clarke|river/.test(t)) return "🚤";
 if(/merlion|flyer|marina|mbs|helix/.test(t)) return "📸";
 if(/mrt|이동|출발 →|복귀/.test(t)) return "🚇";
 return "📍";
}

function pamphletShortTitle(raw){
 const t=(raw||"").trim();
 const rules=[
  [/호텔 출발.*마리나 베이/i,"마리나 베이로 이동"],
  [/가든스 바이 더 베이.*점심/i,"점심 식사"],
  [/가든스 바이 더 베이.*관람/i,"가든스 바이 더 베이"],
  [/마리나 베이 샌즈.*스카이파크/i,"MBS 스카이파크"],
  [/마리나 베이 주변 산책/i,"마리나 베이 산책"],
  [/저녁 식사.*마리나 베이/i,"저녁 식사"],
  [/호텔 출발.*센토사/i,"센토사로 이동"],
  [/USS.*유니버설/i,"USS 입장"],
  [/USS 주요 어트랙션/i,"USS 어트랙션"],
  [/체력 체크 후 일정 판단/i,"오후 일정 선택"],
  [/센토사 자유 일정/i,"센토사 자유시간"],
  [/센토사.*호텔 복귀/i,"호텔 복귀"],
  [/Fort Canning Tree Tunnel/i,"Fort Canning"],
  [/National Museum/i,"National Museum"],
  [/Raffles Hotel.*외관/i,"Raffles Hotel"],
  [/Chinatown.*점심.*산책/i,"Chinatown & 점심"],
  [/Clarke Quay 산책.*저녁/i,"Clarke Quay & 저녁"],
  [/River Cruise/i,"River Cruise"],
  [/S\.?E\.?A\.?.*아쿠아리움/i,"Singapore Oceanarium"],
  [/Singapore Oceanarium/i,"Singapore Oceanarium"],
  [/어드벤처 코브.*해변/i,"Waterpark / Beach"],
  [/실로소 비치.*카페/i,"Siloso Beach"],
  [/루지.*스카이라이드/i,"Luge & Skyride"],
  [/리틀 인디아/i,"Little India"],
  [/캄퐁 글램/i,"Kampong Glam"],
  [/Jewel Changi/i,"Jewel Changi"],
  [/터미널 이동.*탑승/i,"탑승 수속"],
  [/싱가포르.*인천 출발/i,"인천 출발"],
  [/호텔 이동 및 체크인/i,"호텔 체크인"],
  [/저녁 식사 및 휴식/i,"저녁 & 휴식"],
 ];
 for(const [re,s] of rules){if(re.test(t)) return s}
 // Remove long parenthetical explanations for display only.
 return t.replace(/\s*\([^)]{8,}\)\s*/g," ").replace(/\s{2,}/g," ").trim();
}

function enhancePamphlet(doc){
 try{
   const days=[...doc.querySelectorAll(".day")];
   days.forEach((dayEl,di)=>{
     if(di>0) dayEl.classList.add("pamphlet-later-day");
     const slots=[...dayEl.querySelectorAll(".timeline .slot")];
     slots.forEach((slot,si)=>{
       const top=slot.querySelector(".slot-top");
       const act=slot.querySelector(".activity");
       if(!top||!act)return;
       const text=slot.textContent||"";
       const firstB=act.querySelector("b");
       const firstLi=act.querySelector("li");
       if(firstB){
         [...firstB.querySelectorAll(".picon")].forEach(n=>n.remove());
       }

       if(firstB && !firstB.dataset.pamphletShortened){
         const original=firstB.textContent.trim();
         firstB.dataset.originalTitle=original;
         firstB.textContent=pamphletShortTitle(original);
         firstB.dataset.pamphletShortened="1";
       }
       const anchor=firstB||firstLi;
       if(di>0 && !top.querySelector(":scope > .picon")){
         const icon=doc.createElement("span");
         icon.className="picon";
         icon.textContent=pamphletIconFor(text);
         const actEl=top.querySelector(".activity");
         if(actEl) top.insertBefore(icon,actEl);
       }
       if(di>0 && !top.querySelector(".pamphlet-thumb")){
         const pics=pamphletThumbs[di+1]||[];
         if(pics.length){
           const img=doc.createElement("img");img.className="pamphlet-thumb";
           img.src=pics[Math.min(si,pics.length-1)];
           img.alt=(firstB?.textContent||firstLi?.textContent||"관광지").trim();
           img.loading="lazy";
           top.appendChild(img);
         }
       }
     });
   });
 }catch(e){console.error(e)}
}

function injectTheme(){
  try{
    const doc=frame.contentDocument;
    if(!doc)return;
    let s=doc.getElementById('pamphlet-theme-v1');
    if(!s){s=doc.createElement('style');s.id='pamphlet-theme-v1';doc.head.appendChild(s)}
    s.textContent=theme;applyPamphletColors(doc);enhancePamphlet(doc);
  }catch(e){console.error(e)}
}
frame.addEventListener('load',()=>{injectTheme();setTimeout(injectTheme,300);setTimeout(injectTheme,1200);setTimeout(()=>{try{enhancePamphlet(frame.contentDocument)}catch(e){}},2200)});
</script>

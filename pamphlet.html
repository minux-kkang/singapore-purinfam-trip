<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Singapore Family Trip · Pamphlet v11</title>
<style>
:root{
  --bg:#f4f8fa;--card:#fff;--ink:#17364f;--muted:#71818c;--line:#dfe7eb;
  --mint:#e9f7f4;--mintInk:#0b7d73;--blue:#315b8a;--warm:#fff4e6
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif}
body{padding-bottom:80px}
.top{position:sticky;top:0;z-index:30;background:#ffffffef;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.toprow{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.brand{font-size:15px;font-weight:950}.brand small{font-size:10px;color:#93a0a8;margin-left:4px}
.practical{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;color:var(--ink);text-decoration:none;font-size:11px;font-weight:900}
.livebar{padding:0 12px 9px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.livebox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.livebox b{font-size:11px}.livebox span{font-size:11px;color:#647581}.fxrow{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:5px;font-size:11px}
.fxrow input{width:72px;border:1px solid #d4dee3;border-radius:8px;padding:5px 7px;text-align:center;font:inherit}
.days{display:flex;gap:7px;overflow:auto;padding:0 12px 10px;scrollbar-width:none}.days::-webkit-scrollbar{display:none}
.daybtn{border:0;background:#edf2f4;color:#526773;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:900;white-space:nowrap}
.daybtn.on{background:var(--ink);color:#fff}
.wrap{max-width:760px;margin:auto;padding:12px}
.hero{min-height:155px;border:1px solid var(--line);border-radius:24px;padding:22px;background:linear-gradient(145deg,#e7f6f2,#f3f7fb 64%,#fff1df);display:flex;flex-direction:column;justify-content:flex-end;position:relative;margin-bottom:12px}
.heroemoji{position:absolute;right:20px;top:15px;font-size:49px}.heroday{font-size:12px;font-weight:950;color:var(--mintInk)}
.herotitle{font-size:30px;font-weight:1000;line-height:1.05;letter-spacing:-1px;margin-top:4px}.herosub{font-size:13px;color:#71818c;font-weight:700;margin-top:8px}
.timeline{display:grid;gap:9px}.item{background:#fff;border:1px solid var(--line);border-radius:18px;min-height:72px;padding:12px 13px;display:grid;grid-template-columns:64px minmax(0,1fr) 19px;gap:10px;align-items:center;box-shadow:0 4px 14px rgba(23,54,79,.035);cursor:pointer}
.time{background:var(--mint);color:var(--mintInk);border-radius:999px;padding:8px 5px;text-align:center;font-size:12px;font-weight:950;line-height:1.15}
.title{font-size:18px;font-weight:950;line-height:1.25;letter-spacing:-.35px;word-break:keep-all}.arrow{font-size:23px;color:#a5b0b7}

.daymapwrap{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:13px;box-shadow:0 4px 14px rgba(23,54,79,.035)}
.daymaphead{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:10px}
.daymaphead b{font-size:13px;color:var(--ink)}.daymaphead small{font-size:10px;color:#87959e;text-align:right}
.daymap{width:100%;aspect-ratio:1.38/1;border-radius:14px;background:#f8fbfd;overflow:hidden;border:1px solid #e4ecef}
.daymap svg{width:100%;height:100%;display:block}
.map-water{fill:#e9f7ff}
.map-land{fill:#fbfcfd}
.map-park{fill:#edf7ef}
.map-island{fill:#f8fbfc;stroke:#d6e1e6;stroke-width:1.5}
.map-river{fill:none;stroke:#cfe8f6;stroke-width:18;stroke-linecap:round;stroke-linejoin:round}
.map-bay{fill:#e6f5ff;stroke:#d3eaf5;stroke-width:2}
.map-road{fill:none;stroke:#d3dde3;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.map-road.minor{stroke-width:4;opacity:.7}
.map-line{fill:none;stroke:#adbfc9;stroke-width:2.2;stroke-dasharray:3 5}
.map-route{fill:none;stroke:#17364f;stroke-width:4.4;stroke-linecap:round;stroke-linejoin:round}
.map-route.walk{stroke-dasharray:4 5;stroke-width:3.1}
.map-route.mrt{stroke-width:5.3}
.map-route.taxi{stroke-dasharray:10 7}
.map-route.option{stroke:#8ba0ad;stroke-dasharray:6 6}
.map-label{font-size:10.6px;font-weight:850;fill:#284050}
.map-small{font-size:8.8px;fill:#7e8d96}
.map-line-label{font-size:8.4px;font-weight:700;fill:#315b8a}
.pin circle{fill:#17364f;stroke:#fff;stroke-width:3}
.pin text{fill:#fff;font-size:10px;font-weight:950;text-anchor:middle;dominant-baseline:middle}
.pin.hotel circle{fill:#0b7d73}
.maplegend{display:flex;gap:10px;flex-wrap:wrap;margin-top:9px;font-size:10px;color:#6f808b}
.maplegend span{display:flex;align-items:center;gap:4px}.maplegend i{display:inline-block;width:20px;height:0;border-top:3px solid #17364f}
.maplegend i.walk{border-top-style:dashed;border-top-width:2px}.maplegend i.taxi{border-top-style:dashed}.maplegend i.option{border-top-color:#8ba0ad;border-top-style:dashed}
.mapnote{margin-top:7px;font-size:10px;color:#819099}
.footer{text-align:center;font-size:11px;color:#98a4ab;padding:18px 0}

.backdrop{position:fixed;inset:0;background:#0d223270;opacity:0;pointer-events:none;z-index:50;transition:.2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-radius:24px 24px 0 0;max-height:88dvh;transform:translateY(105%);transition:.22s;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
body.open .backdrop{opacity:1;pointer-events:auto}body.open .sheet{transform:translateY(0)}
.handle{width:42px;height:5px;background:#d2dbe0;border-radius:99px;margin:9px auto 5px}.sheethead{display:flex;justify-content:space-between;gap:12px;padding:7px 17px 10px}
.stime{font-size:12px;color:var(--mintInk);font-weight:950}.stitle{font-size:21px;line-height:1.3;font-weight:950}.close{border:0;background:#eef3f5;width:36px;height:36px;border-radius:50%;font-size:21px}
.body{overflow:auto;padding:0 16px 28px;font-size:14px;line-height:1.6;color:#314956}
.section{padding:14px 0;border-bottom:1px solid #edf1f3}.section:last-child{border-bottom:0}
.section h3{font-size:13px;margin:0 0 8px;color:#17364f}.route{background:#f7fbfc;border:1px solid #dde9ed;border-radius:14px;padding:12px}
.route-line{display:grid;gap:7px}.stop{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;align-items:start}.dot{width:24px;height:24px;border-radius:50%;background:#17364f;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:950}.stop b{display:block}.stop small{display:block;color:#7a8a94;margin-top:2px}
.connector{width:2px;height:18px;background:#b9c8cf;margin-left:11px}
.checklist{display:grid;gap:7px}.check{background:#fffaf3;border:1px solid #f1dfc8;border-radius:12px;padding:9px 10px;font-size:12px}
.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.actions button,.actions a{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:11px 8px;text-align:center;text-decoration:none;font-weight:900;font-size:12px}.actions .primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.detailsbox{background:#f7f8fa;border-radius:12px;padding:11px;font-size:12px}.memo{width:100%;min-height:120px;border:1px solid #d5e0e5;border-radius:12px;padding:11px;font:inherit}
@media(min-width:700px){.timeline{grid-template-columns:1fr 1fr}}
</style>
</head>

let day=1,sel=null;
const daysEl=document.getElementById("days"),hero=document.getElementById("hero"),timeline=document.getElementById("timeline"),body=document.getElementById("body"),dayMapWrap=document.getElementById("dayMapWrap");
const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function current(){return DAYS.find(x=>x.day===day)}
function render(){
 const d=current();
 daysEl.innerHTML=DAYS.map(x=>`<button class="daybtn ${x.day===day?'on':''}" data-day="${x.day}">DAY ${x.day}</button>`).join("");
 hero.innerHTML=`<div class="heroemoji">${d.icon}</div><div class="heroday">DAY ${d.day}</div><div class="herotitle">${esc(d.title)}</div><div class="herosub">${esc(d.sub)}</div>`;
 timeline.innerHTML=d.items.map((x,i)=>`<article class="item" data-i="${i}"><div class="time">${i+1}<br><span style="font-size:10px;font-weight:800">${esc(x.time)}</span></div><div class="title">${esc(x.title)}</div><div class="arrow">›</div></article>`).join("");
 renderDayMap();
}
function renderDayMap(){
 const m=DAY_MAPS[day];
 if(!m){dayMapWrap.innerHTML="";return;}
 const roads=(m.roads||[]).map(d=>`<path d="${d}" class="map-road"/>`).join("");
 const routes=(m.routes||[]).map(r=>`<path d="${r[1]}" class="map-route ${r[0]}"/>`).join("");
 const labels=(m.labels||[]).map(l=>`<text x="${l[1]}" y="${l[2]}" class="${l[3]==='small'?'map-small':'map-label'}">${esc(l[0])}</text>`).join("");
 const pins=(m.pins||[]).map(p=>`<g class="pin ${p[3]==='hotel'?'hotel':''}" data-pin="${p[0]}" transform="translate(${p[1]} ${p[2]})"><circle r="14"></circle><text x="0" y="1">${p[0]}</text></g>`).join("");
 dayMapWrap.innerHTML=`<div class="daymaphead"><b>🗺️ ${esc(m.title)}</b><small>${esc(m.subtitle)}</small></div>
 <div class="daymap"><svg viewBox="0 0 640 430" preserveAspectRatio="xMidYMid meet">${m.bg||''}${roads}${routes}${labels}${pins}</svg></div>
 <div class="maplegend"><span><i></i> 주요 이동</span><span><i class="walk"></i> 도보</span><span><i class="taxi"></i> Grab/택시</span><span><i class="option"></i> OPTION</span></div>
 <div class="mapnote">배경 지형과 주요 지역 윤곽을 넣고, 실제 이동 흐름을 연상하도록 단순화했습니다. 핀 번호는 위 일정 번호와 연결됩니다.</div>`;
 dayMapWrap.querySelectorAll(".pin").forEach(pin=>pin.onclick=()=>{const idx=+pin.dataset.pin-1;if(current().items[idx])openItem(idx)});
}
function routeHtml(r=[]){
 if(!r.length)return "";
 return `<div class="route"><div class="route-line">`+r.map((x,i)=>`<div class="stop"><div class="dot">${i+1}</div><div><b>${esc(x[0])} ${esc(x[1])}</b><small>${esc(x[2]||"")}</small></div></div>${i<r.length-1?'<div class="connector"></div>':''}`).join("")+`</div></div>`;
}
function chips(arr=[]){return arr.map(x=>`<div class="check">${esc(x)}</div>`).join("")}
function openItem(i){
 sel=current().items[+i];
 document.getElementById("stime").textContent=sel.time;
 document.getElementById("stitle").textContent=sel.title;
 const noteKey=`sg_pamphlet_v11_${day}_${i}`;
 body.innerHTML=`
  <section class="section"><h3>🚶 지금 이렇게 움직이면 됩니다</h3>${routeHtml(sel.route)}</section>
  <section class="section"><h3>👀 여기서 할 것</h3><div class="checklist">${chips(sel.see||[])}</div></section>
  <section class="section"><h3>👨‍👩‍👧 가족 체크</h3><div class="checklist">${chips(sel.family||[])}</div></section>
  ${sel.food?.length?`<section class="section"><h3>🍽 식사</h3><div class="checklist">${chips(sel.food)}</div></section>`:""}
  <section class="section"><h3>📝 한 줄 설명</h3><div class="detailsbox">${esc(sel.detail||"")}</div></section>
  <section class="section"><h3>빠른 기능</h3><div class="actions"><a class="primary" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(sel.title+" Singapore")}">📍 실제지도</a><button type="button" id="memoToggle">✏️ 메모</button></div><div id="memoWrap" style="display:none;margin-top:10px"><textarea class="memo" id="memo" placeholder="우리 가족 메모"></textarea></div></section>`;
 document.getElementById("memoToggle").onclick=()=>{const w=document.getElementById("memoWrap");w.style.display=w.style.display==="none"?"block":"none";if(w.style.display==="block"){const m=document.getElementById("memo");m.value=localStorage.getItem(noteKey)||"";m.oninput=()=>localStorage.setItem(noteKey,m.value)}};
 document.body.classList.add("open");
}
daysEl.onclick=e=>{const b=e.target.closest("[data-day]");if(!b)return;day=+b.dataset.day;render();scrollTo(0,0)};
timeline.onclick=e=>{const x=e.target.closest(".item");if(x)openItem(x.dataset.i)};
document.getElementById("close").onclick=document.getElementById("backdrop").onclick=()=>document.body.classList.remove("open");
function clocks(){const n=new Date(),f=tz=>new Intl.DateTimeFormat("ko-KR",{timeZone:tz,hour:"2-digit",minute:"2-digit",hour12:false}).format(n);document.getElementById("krTime").textContent=f("Asia/Seoul");document.getElementById("sgTime").textContent=f("Asia/Singapore")}
clocks();setInterval(clocks,60000);render();
</script>

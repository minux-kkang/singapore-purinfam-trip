<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Singapore Family Trip · Pamphlet View v02</title>
<style>
html,body{margin:0;background:#edf2f6;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",Arial,sans-serif}
.shell{min-height:100vh}
.topbar{height:46px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px;background:#f7fafc;border-bottom:1px solid #dbe3ea;position:sticky;top:0;z-index:10}
.brand{font-size:14px;font-weight:900;color:#17324f}.brand small{display:block;font-size:9px;font-weight:700;color:#6b7a89;margin-top:1px}
.actions{display:flex;gap:6px}.actions a{border:1px solid #d7e0e7;background:#fff;color:#17324f;text-decoration:none;border-radius:8px;padding:6px 8px;font-size:9px;font-weight:850}
#appframe{display:block;width:100%;height:calc(100vh - 47px);border:0;background:white}
@media(max-width:640px){.topbar{height:42px;padding:0 7px}.brand{font-size:12px}.brand small{display:none}.actions a{font-size:8px;padding:5px 7px}#appframe{height:calc(100vh - 43px)}}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand">🇸🇬 Singapore Family Trip · Pamphlet View v02<small>가족 공유용 요약 화면 · 상세 기능은 기존 앱에 유지</small></div>
    <div class="actions"><a href="./index.html">기존 화면</a></div>
  </div>
  <iframe id="appframe" src="./index.html" title="Singapore Family Trip"></iframe>
</div>
<script>
const frame=document.getElementById('appframe');
const theme=`
:root{
 --bg:#eef3f7!important;--card:#fff!important;--ink:#17324f!important;--muted:#677789!important;--line:#d8e2ea!important;
 --accent:#0f766e!important;--soft:#edf8f5!important;--blue:#2f6f9f!important;--warn:#9a6700!important;--warnbg:#fff8e6!important;
}
html{scroll-behavior:smooth}
body{background:linear-gradient(#f6f9fb,#edf3f7)!important;color:#203040!important}
.wrap{max-width:1160px!important;padding:8px!important}

/* ---- 상단: 웹앱 느낌을 줄이고 여행 브로셔처럼 ---- */
.hero{border-radius:16px!important;border:1px solid #d9e3eb!important;box-shadow:0 7px 22px rgba(35,55,70,.06)!important;
      padding:13px 15px!important;background:linear-gradient(110deg,#fbfdff,#f2f7fb)!important}
h1{font-size:clamp(21px,3vw,29px)!important;line-height:1.12!important;letter-spacing:-.5px!important}
.sub{margin-top:4px!important;font-size:10px!important;color:#708092!important}
.badges{margin-top:8px!important;gap:5px!important}.badge{font-size:9px!important;padding:4px 7px!important}

/* 시간/날씨 + 환율은 남기되 최대한 얇게 */
.headtools{grid-template-columns:1.15fr .85fr!important;gap:6px!important;margin-top:8px!important}
.headtool{padding:7px 9px!important;border-radius:10px!important;background:#fff!important;border:1px solid #e0e7ed!important;font-size:9px!important;line-height:1.35!important}
.clockrow{gap:8px!important}.clockitem b{font-size:10px!important}
.fxrow{gap:4px!important}.fxrow input{padding:4px 5px!important;font-size:9px!important;width:75px!important}.fxrate{width:62px!important}

/* 공지/동기화 상태는 첫 화면에서 숨김 */
.browsernotice,.sharedstatus{display:none!important}

/* 상위 메뉴는 기능은 유지하되 얇은 메뉴바 */
.modebar{gap:4px!important;margin-top:7px!important;display:grid!important;grid-template-columns:repeat(5,1fr)!important}
.modebtn{padding:7px 3px!important;font-size:9px!important;border-radius:9px!important;white-space:nowrap!important}
.modebtn.active{background:#17324f!important;border-color:#17324f!important}

/* DAY 탭: 작은 컬러 인덱스 */
.tabs{gap:4px!important;padding:7px 0 6px!important;display:grid!important;grid-template-columns:repeat(6,1fr)!important;overflow:visible!important}
.tab{border:0!important;border-radius:9px!important;padding:7px 2px!important;font-size:9px!important;background:#e4eaf0!important}
.tab.active{color:white!important;box-shadow:0 3px 10px rgba(0,0,0,.10)!important}

/* 하루 제목 = 팜플렛 컬러 헤더 */
.dayhead{padding:12px 14px!important;margin-bottom:7px!important;border-radius:14px!important;
         background:linear-gradient(110deg,color-mix(in srgb,var(--day-color,#2787c5) 92%,#fff),color-mix(in srgb,var(--day-color,#2787c5) 72%,#fff))!important;
         border:0!important;box-shadow:0 5px 16px rgba(35,55,70,.08)!important;color:white!important}
.dayhead h2{font-size:clamp(17px,2.3vw,22px)!important;margin:0 0 2px!important;color:white!important}
.dayhead .theme{font-size:9px!important;color:rgba(255,255,255,.88)!important}

/* 팜플렛 요약: 좌측 일정 / 우측 핵심정보 */
.layout{grid-template-columns:minmax(0,1.18fr) minmax(300px,.82fr)!important;gap:7px!important;align-items:start!important}
.panel{border-radius:12px!important;border:1px solid #d9e2ea!important;padding:9px!important;box-shadow:0 3px 12px rgba(35,55,70,.035)!important;background:#fff!important}
.panel h2,.panel h3{margin-top:0!important;font-size:12px!important}

/* 일정은 한눈에: 세부 메타/메모/상세접기 기본 숨김 */
.timeline{gap:0!important}
.slot{padding:7px 0!important}
.slot-top{grid-template-columns:70px minmax(0,1fr)!important;gap:7px!important}
.when{font-size:10px!important;color:var(--day-color,#2f6f9f)!important;font-weight:900!important}
.activity b{font-size:11px!important;line-height:1.25!important}
.steps{margin:2px 0 0!important;padding-left:14px!important;font-size:8px!important;line-height:1.35!important}
.steps li{margin:1px 0!important}
.meta,.foodmeta,.note,details,.logbtn{display:none!important}

/* 보조 정보 카드도 압축 */
.mastergrid{grid-template-columns:repeat(3,1fr)!important;gap:6px!important;margin-top:6px!important}
.mini{font-size:8px!important}
.knowledge .fact{padding:5px 0!important;font-size:8px!important}
.checklist label{font-size:8px!important;padding:4px 0!important}

/* 상세/공부/준비 페이지는 원래 기능 유지하되 테마 통일 */
.studyintro,.studycard,.prepsection,.journalhero,.journalday{
 border-radius:12px!important;border:1px solid #d9e2ea!important;box-shadow:0 3px 12px rgba(35,55,70,.035)!important;padding:12px!important
}
.studytabs,.prepnav{gap:5px!important;padding:8px 0 6px!important}
.studytab,.editbtn,.smallbtn{font-size:9px!important;padding:6px 8px!important;border-radius:8px!important}
.bigline{font-size:13px!important;padding:8px 10px!important}
.flow{gap:5px!important}.flow div{font-size:9px!important;padding:7px!important}
.story{font-size:11px!important;line-height:1.65!important}
.studybox{padding:9px!important}.studybox h3{font-size:11px!important}
.prepsection{font-size:10px!important}.checkgroup h3{font-size:11px!important}.localcheck{font-size:9px!important;padding:5px 0!important}
.journalentry{padding:9px 0!important}.journaltext{font-size:10px!important}.journalmeta,.journalplace{font-size:8px!important}

/* 하단 */
.footer{font-size:8px!important;margin:12px 0 18px!important}

/* 모바일: 정말 팜플렛처럼 한 줄씩 */
@media(max-width:820px){
 .wrap{padding:5px!important}
 .hero{padding:9px 10px!important;border-radius:12px!important}
 h1{font-size:19px!important}
 .sub{font-size:8px!important}
 .badges{display:none!important}
 .headtools{grid-template-columns:1fr!important}
 .headtool{padding:6px 7px!important;font-size:8px!important}
 .modebar{position:sticky!important;top:0!important;z-index:60!important;background:#edf3f7!important;padding:4px 0!important;margin-top:5px!important}
 .modebtn{font-size:8px!important;padding:6px 1px!important}
 .tabs{position:sticky!important;top:36px!important;z-index:55!important;background:#edf3f7!important;padding:4px 0 5px!important}
 .tab{font-size:7.5px!important;padding:6px 1px!important}
 .layout{grid-template-columns:1fr!important}
 .panel{padding:8px!important}
 .slot-top{grid-template-columns:54px minmax(0,1fr)!important;gap:5px!important}
 .when{font-size:8px!important}
 .activity b{font-size:10px!important}
 .steps{font-size:7.5px!important}
 .dayhead{padding:10px 11px!important}
 .dayhead h2{font-size:16px!important}
 .dayhead .theme{font-size:8px!important}
 .mastergrid{grid-template-columns:1fr 1fr!important}
}
`;
const dayColors=["#0b76b5","#1b9cda","#18874d","#ef6a18","#139cad","#6737b4"];
function applyPamphletColors(doc){
  try{
    const days=[...doc.querySelectorAll(".day")];
    days.forEach((el,i)=>el.style.setProperty("--day-color",dayColors[i]||dayColors[0]));
    const tabs=[...doc.querySelectorAll(".tabs .tab")];
    tabs.forEach((el,i)=>{
      el.style.setProperty("--day-color",dayColors[i]||dayColors[0]);
      if(el.classList.contains("active")) el.style.background=dayColors[i]||dayColors[0];
      el.addEventListener("click",()=>setTimeout(()=>{
        tabs.forEach((t,j)=>{t.style.background=t.classList.contains("active")?(dayColors[j]||dayColors[0]):"#e4eaf0"});
      },20),{passive:true});
    });
  }catch(e){}
}

function injectTheme(){
  try{
    const doc=frame.contentDocument;
    if(!doc)return;
    let s=doc.getElementById('pamphlet-theme-v1');
    if(!s){s=doc.createElement('style');s.id='pamphlet-theme-v1';doc.head.appendChild(s)}
    s.textContent=theme;applyPamphletColors(doc);
  }catch(e){console.error(e)}
}
frame.addEventListener('load',()=>{injectTheme();setTimeout(injectTheme,300);setTimeout(injectTheme,1200)});
</script>
</body>
</html>
